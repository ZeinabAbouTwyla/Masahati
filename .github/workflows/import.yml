name: import-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=$(gh api repos/${{ github.repository }}/releases/tags/import --jq '.assets[0].name')
          gh release download import --pattern "$ASSET" --dir /tmp/import
      - name: Extract and copy into repo root
        run: |
          mkdir -p /tmp/extract
          ZIP=$(ls /tmp/import/*.zip | head -n1)
          unzip -o "$ZIP" -d /tmp/extract
          SRC=/tmp/extract
          COUNT=$(ls -A /tmp/extract | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(ls -A /tmp/extract)
            if [ -d "/tmp/extract/$ONLY" ]; then
              SRC="/tmp/extract/$ONLY"
            fi
          fi
          cp -r "$SRC"/. .
      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import site files"
      - name: Remove workflow and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/import.yml
          git add -A
          git commit -m "Remove import workflow"
          git push
          gh release delete import --yes --cleanup-tag
